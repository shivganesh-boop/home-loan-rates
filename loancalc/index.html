.panel{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:20px}

.empty{color:var(--mu);padding:30px 6px;text-align:center}
.note{background:var(--hibg);border:1px solid var(--hi);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.save{background:var(--acbg);border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.bank{border:1px solid var(--bd);border-radius:14px;padding:14px 16px;margin-bottom:12px;background:var(--card)}
.bank.best{border-color:var(--hi);background:var(--hibg)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.nm{font-weight:600;font-size:16px}
.tag{font-size:12px;font-weight:600;color:var(--hi);margin-left:8px}
.rate{font:600 30px/1 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ac)}
.rate small{display:inline;font:13px system-ui,sans-serif}
.rng{color:var(--mu);font-size:13px}
.emi{font-size:13.5px;margin-top:8px}
.bank ul{margin:8px 0 0;padding-left:18px;color:var(--mu);font-size:13.5px}
.bank.na .rate{color:var(--no);font-size:18px}
.wa{display:block;text-align:center;text-decoration:none;font:600 15px system-ui,sans-serif;background:#1d9a52;color:#fff;padding:13px;border-radius:14px;margin:4px 0 12px}
.disc{color:#0a1d3b;font-size:12.5px;margin-top:16px}
:root,:root:not([data-theme="light"]),:root[data-theme="dark"]{--card:#fff;--inp:#fff;--acbg:#fff;--hibg:#fff;--tx:#10303f;--mu:#506879;--bd:#d0dee7;--ac:#0b3d59;--hi:#0d6485;--no:#8a5a44;color-scheme:light}
button.go{color:#fff!important}
.ltv,.save,.inf{border:1px solid var(--bd)}
.bank.best{border-width:2px}
.i{margin-left:auto;flex:none;width:22px;height:22px;border-radius:50%;border:1px solid var(--ac);background:transparent;color:var(--ac);font:italic 700 13px/1 Georgia,serif;cursor:pointer;padding:0}
.inf{background:var(--acbg);border-radius:12px;padding:10px 12px;margin:0 0 8px;font-size:13px;line-height:1.55}
.inf b{display:block;margin-top:4px;color:var(--ac)}
.inf b:first-child{margin-top:0}
.ltv{background:var(--acbg);border-radius:12px;padding:10px 12px;margin-bottom:14px;font-size:14px}
#ltvF{font-weight:700;font-size:18px;color:var(--ac);margin:2px 0}
</style>

var T={
h1:["What home loan rate can you expect?","आपको होम लोन पर कौन सा ब्याज दर मिल सकता है?","तुम्हाला गृहकर्जावर कोणता व्याजदर मिळू शकतो?"],
sub:["Enter your approximate CIBIL score and answer a few questions. You will see an estimated rate from five banks, lowest first.","अपना अनुमानित CIBIL स्कोर डालें और कुछ सवालों के जवाब दें। आपको पाँच बैंकों की अनुमानित दरें दिखेंगी, सबसे कम पहले।","तुमचा अंदाजे CIBIL स्कोर टाका आणि काही प्रश्नांची उत्तरे द्या. पाच बँकांचे अंदाजे दर दिसतील, सर्वात कमी आधी."],
det:["Your details","आपकी जानकारी","तुमची माहिती"],
hist:["Your credit history (choose one)","आपका क्रेडिट इतिहास (एक चुनें)","तुमचा क्रेडिट इतिहास (एक निवडा)"],
hasS:["I have a CIBIL score","मेरे पास CIBIL स्कोर है","माझ्याकडे CIBIL स्कोर आहे"],
newC:["I am new to credit","मैं क्रेडिट में नया हूँ","मी क्रेडिटसाठी नवीन आहे"],
newCs:["No score, or a score of -1 / 0","कोई स्कोर नहीं, या स्कोर -1 / 0 है","स्कोर नाही, किंवा स्कोर -1 / 0 आहे"],
scL:["Approximate CIBIL score","अनुमानित CIBIL स्कोर","अंदाजे CIBIL स्कोर"],
gen:["Gender of the main applicant","मुख्य आवेदक का लिंग","मुख्य अर्जदाराचे लिंग"],
male:["Male","पुरुष","पुरुष"],female:["Female","महिला","महिला"],other:["Other","अन्य","इतर"],
emp:["Employment type","रोज़गार का प्रकार","नोकरीचा प्रकार"],

e2:["Salaried, Government / PSU","वेतनभोगी, सरकारी / PSU","पगारदार, सरकारी / PSU"],
e3:["Self-employed or business","स्वरोज़गार या व्यवसाय","स्वयंरोजगार किंवा व्यवसाय"],
e4:["Pensioner","पेंशनभोगी","निवृत्तीवेतनधारक"],
amtL:["Loan amount","लोन राशि","कर्जाची रक्कम"],selY:["Select years","वर्ष चुनें","वर्षे निवडा"],errA:["Loan amount can be at most ₹10 crore.","लोन राशि अधिकतम ₹10 करोड़ हो सकती है।","कर्जाची रक्कम कमाल ₹10 कोटी असू शकते."],
yrsL:["Tenure (years)","अवधि (वर्ष)","कालावधी (वर्षे)"],
phS:["For example 765","जैसे 765","उदा. 765"],phA:["Whole number, for example 5000000","पूर्ण संख्या, जैसे 5000000","पूर्ण संख्या, उदा. 5000000"],
young:["An applicant or co-applicant is 40 years or younger","कोई आवेदक या सह-आवेदक 40 वर्ष या उससे कम उम्र का है","कोणताही अर्जदार किंवा सह-अर्जदार 40 वर्षे किंवा कमी वयाचा आहे"],
inc:["Gross annual income is ₹18 lakh or more","कुल वार्षिक आय ₹18 लाख या अधिक है","एकूण वार्षिक उत्पन्न ₹18 लाख किंवा अधिक आहे"],
take:["Balance transfer (takeover), resale, fully disbursed or Government project property","बैलेंस ट्रांसफर (टेकओवर), पुनर्विक्रय, पूरी तरह वितरित या सरकारी परियोजना की संपत्ति","बॅलन्स ट्रान्सफर (टेकओव्हर), पुनर्विक्री, पूर्ण वितरित किंवा सरकारी प्रकल्पातील मालमत्ता"],

ins:["I will take loan insurance","मैं लोन बीमा लूँगा/लूँगी","मी कर्ज विमा घेईन"],

green:["The property is a green (eco-friendly) home","संपत्ति ग्रीन (पर्यावरण-अनुकूल) घर है","मालमत्ता ग्रीन (पर्यावरणपूरक) घर आहे"],
go:["Show my rates","मेरी दरें दिखाएँ","माझे दर दाखवा"],

rsS:["Resale: you buy the flat from its current owner, not from a builder. Fully disbursed: the property is ready, so the bank pays the full loan in one go. Government project: the flat is part of a project by a government body.","पुनर्विक्रय: आप फ्लैट बिल्डर से नहीं, उसके मौजूदा मालिक से खरीदते हैं। पूरी तरह वितरित: संपत्ति तैयार है, इसलिए बैंक पूरा लोन एक बार में देता है। सरकारी परियोजना: फ्लैट किसी सरकारी संस्था की परियोजना का हिस्सा है।","पुनर्विक्री: तुम्ही फ्लॅट बिल्डरकडून नव्हे, तर त्याच्या सध्याच्या मालकाकडून घेता. पूर्ण वितरित: मालमत्ता तयार आहे, म्हणून बँक पूर्ण कर्ज एकदाच देते. सरकारी प्रकल्प: फ्लॅट सरकारी संस्थेच्या प्रकल्पाचा भाग आहे."],
pvL:["Property value (to find your loan-to-value, LTV)","संपत्ति का मूल्य (आपका लोन-टू-वैल्यू, LTV जानने के लिए)","मालमत्तेचे मूल्य (तुमचे लोन-टू-व्हॅल्यू, LTV काढण्यासाठी)"],
ltvM:["Loan-to-value (LTV) is the share of the property price that the bank lends you. Example: property ₹1 crore and loan ₹75 lakh means LTV is 75%. You pay the rest from your own money.","लोन-टू-वैल्यू (LTV) संपत्ति की कीमत का वह हिस्सा है जो बैंक आपको कर्ज में देता है। उदाहरण: संपत्ति ₹1 करोड़ और लोन ₹75 लाख हो तो LTV 75% है। बाकी रकम आप अपनी जेब से देते हैं।","लोन-टू-व्हॅल्यू (LTV) म्हणजे मालमत्तेच्या किमतीचा तो भाग जो बँक तुम्हाला कर्ज म्हणून देते. उदाहरण: मालमत्ता ₹1 कोटी आणि कर्ज ₹75 लाख असेल तर LTV 75% आहे. उरलेली रक्कम तुम्ही स्वतः भरता."],
phP:["Whole number, for example 8000000","पूर्ण संख्या, जैसे 8000000","पूर्ण संख्या, उदा. 8000000"],
ltvIs:["Your LTV is about {0}%","आपका LTV लगभग {0}% है","तुमचा LTV सुमारे {0}% आहे"],

ltvC:["LTV is capped at 90%. We used a loan of {0}, which is 90% of the property value.","LTV अधिकतम 90% तक सीमित है। हमने {0} का लोन लिया, जो संपत्ति के मूल्य का 90% है।","LTV कमाल 90% पर मर्यादित आहे. आम्ही {0} चे कर्ज धरले, जे मालमत्तेच्या मूल्याच्या 90% आहे."],

sgP:["{0} lends at most {1}% of the property value, about {2}. To use it, pay about {3} more from your own money.","{0} संपत्ति के मूल्य का अधिकतम {1}% देता है, यानी लगभग {2}। इसका लाभ लेने के लिए अपनी जेब से लगभग {3} और दें।","{0} मालमत्तेच्या मूल्याच्या कमाल {1}% देते, म्हणजे सुमारे {2}. याचा लाभ घेण्यासाठी स्वतःकडून सुमारे {3} जास्त भरा."],

sv1:["Interest saved: your rate is {0}%. The lowest estimate here is {1}% ({2}). Over {4} years you could save about {3} in interest, and about {5} less every month.","ब्याज की बचत: आपकी दर {0}% है। यहाँ सबसे कम अनुमान {1}% ({2}) है। {4} वर्षों में आप लगभग {3} ब्याज बचा सकते हैं, और हर महीने लगभग {5} कम दे सकते हैं।","व्याजाची बचत: तुमचा दर {0}% आहे. येथील सर्वात कमी अंदाज {1}% ({2}) आहे. {4} वर्षांत तुम्ही सुमारे {3} व्याज वाचवू शकता, आणि दर महिन्याला सुमारे {5} कमी भरू शकता."],
sv2:["Your rate of {0}% is the same as or lower than the lowest estimate here ({1}% at {2}). That looks like a good offer.","आपकी {0}% दर यहाँ के सबसे कम अनुमान ({1}%, {2}) के बराबर या उससे कम है। यह अच्छा ऑफर लगता है।","तुमचा {0}% दर येथील सर्वात कमी अंदाजाइतका ({1}%, {2}) किंवा त्यापेक्षा कमी आहे. ही चांगली ऑफर दिसते."],
sv3:["Enter the loan amount and tenure to see how much interest you could save.","कितना ब्याज बच सकता है यह देखने के लिए लोन राशि और अवधि डालें।","किती व्याज वाचू शकते ते पाहण्यासाठी कर्जाची रक्कम आणि कालावधी टाका."],

i_young:["Bank of Baroda gives a lower rate if an applicant or co-applicant is 40 years or younger.|Bank of Baroda (0.10% off).|Bank of Baroda only. Only one concession counts, up to 0.10% in total, and the rate stays at 7.40% or above.","बैंक ऑफ बड़ौदा कम दर देता है यदि कोई आवेदक या सह-आवेदक 40 वर्ष या उससे कम उम्र का हो।|बैंक ऑफ बड़ौदा (0.10% कम)।|केवल बैंक ऑफ बड़ौदा। केवल एक छूट गिनी जाती है, कुल अधिकतम 0.10%, और दर 7.40% या उससे ऊपर रहती है।","कोणताही अर्जदार किंवा सह-अर्जदार 40 वर्षे किंवा कमी वयाचा असल्यास बँक ऑफ बडोदा कमी दर देते.|बँक ऑफ बडोदा (0.10% कमी).|फक्त बँक ऑफ बडोदा. फक्त एकच सवलत गणली जाते, एकूण कमाल 0.10%, आणि दर 7.40% किंवा त्यापेक्षा जास्त राहतो."],
i_inc18:["Indian Bank gives a better rate to new-to-credit applicants with a gross annual income of ₹18 lakh or more.|Indian Bank (7.85% instead of 8.30% for salaried applicants).|Indian Bank only, and only for new-to-credit applicants.","इंडियन बैंक ₹18 लाख या अधिक वार्षिक आय वाले नए-क्रेडिट आवेदकों को बेहतर दर देता है।|इंडियन बैंक (वेतनभोगियों के लिए 8.30% की जगह 7.85%)।|केवल इंडियन बैंक, और केवल नए-क्रेडिट आवेदकों के लिए।","इंडियन बँक ₹18 लाख किंवा अधिक वार्षिक उत्पन्न असलेल्या नवीन-क्रेडिट अर्जदारांना चांगला दर देते.|इंडियन बँक (पगारदारांसाठी 8.30% ऐवजी 7.85%).|फक्त इंडियन बँक, आणि फक्त नवीन-क्रेडिट अर्जदारांसाठी."],
i_bt:["Banks give a lower rate if you move an existing home loan to them.|Bank of Baroda (0.10% off) and Bank of India (up to 0.10% off).|Bank of Baroda and Bank of India.","यदि आप अपना मौजूदा होम लोन किसी बैंक में ट्रांसफर करते हैं तो बैंक कम दर देते हैं।|बैंक ऑफ बड़ौदा (0.10% कम) और बैंक ऑफ इंडिया (0.10% तक कम)।|बैंक ऑफ बड़ौदा और बैंक ऑफ इंडिया।","तुमचे सध्याचे गृहकर्ज बँकेत हलवल्यास बँका कमी दर देतात.|बँक ऑफ बडोदा (0.10% कमी) आणि बँक ऑफ इंडिया (0.10% पर्यंत कमी).|बँक ऑफ बडोदा आणि बँक ऑफ इंडिया."],
i_rs:["Bank of Baroda gives a lower rate for resale, fully disbursed and Government project properties.|Bank of Baroda (0.10% off).|Bank of Baroda only. It does not add to the balance transfer concession.","बैंक ऑफ बड़ौदा पुनर्विक्रय, पूरी तरह वितरित और सरकारी परियोजना की संपत्तियों पर कम दर देता है।|बैंक ऑफ बड़ौदा (0.10% कम)।|केवल बैंक ऑफ बड़ौदा। यह बैलेंस ट्रांसफर की छूट के साथ जुड़ती नहीं है।","बँक ऑफ बडोदा पुनर्विक्री, पूर्ण वितरित आणि सरकारी प्रकल्पातील मालमत्तांवर कमी दर देते.|बँक ऑफ बडोदा (0.10% कमी).|फक्त बँक ऑफ बडोदा. ही बॅलन्स ट्रान्सफर सवलतीत मिसळत नाही."],
i_nri:["Bank of India has a special product for NRIs and women at a fixed 7.90%.|Bank of India (Star Pravasi Loan).|Bank of India only. If 7.90% is lower than its normal rate, we show 7.90%.","बैंक ऑफ इंडिया के पास NRI और महिलाओं के लिए 7.90% की निश्चित दर वाला विशेष उत्पाद है।|बैंक ऑफ इंडिया (स्टार प्रवासी लोन)।|केवल बैंक ऑफ इंडिया। यदि 7.90% उसकी सामान्य दर से कम हो तो हम 7.90% दिखाते हैं।","बँक ऑफ इंडियाकडे NRI आणि महिलांसाठी 7.90% निश्चित दराचे विशेष उत्पादन आहे.|बँक ऑफ इंडिया (स्टार प्रवासी लोन).|फक्त बँक ऑफ इंडिया. 7.90% त्याच्या सामान्य दरापेक्षा कमी असल्यास आम्ही 7.90% दाखवतो."],
i_ins:["Some banks quote a lower rate when you take loan insurance.|Bank of Baroda (0.05% cheaper), HDFC (its rates are quoted with insurance) and Bank of India (may give up to 0.10% extra).|Bank of Baroda uses its with-insurance rate. For HDFC and Bank of India we only show a note.","कुछ बैंक लोन बीमा लेने पर कम दर देते हैं।|बैंक ऑफ बड़ौदा (0.05% सस्ता), HDFC (दरें बीमा के साथ बताई जाती हैं) और बैंक ऑफ इंडिया (0.10% तक अतिरिक्त छूट संभव)।|बैंक ऑफ बड़ौदा बीमा वाली दर चुनता है। HDFC और बैंक ऑफ इंडिया के लिए हम केवल नोट दिखाते हैं।","काही बँका कर्ज विमा घेतल्यास कमी दर देतात.|बँक ऑफ बडोदा (0.05% स्वस्त), HDFC (दर विम्यासह सांगितले जातात) आणि बँक ऑफ इंडिया (0.10% पर्यंत अतिरिक्त सवलत शक्य).|बँक ऑफ बडोदा विम्यासह दर वापरते. HDFC आणि बँक ऑफ इंडियासाठी आम्ही फक्त टीप दाखवतो."],
i_h345:["Central Bank has separate rates when this is your 3rd, 4th or 5th home loan.|Central Bank of India.|Central Bank only.","यह आपका तीसरा, चौथा या पाँचवाँ होम लोन हो तो सेंट्रल बैंक की दरें अलग हैं।|सेंट्रल बैंक ऑफ इंडिया।|केवल सेंट्रल बैंक।","हे तुमचे तिसरे, चौथे किंवा पाचवे गृहकर्ज असल्यास सेंट्रल बँकेचे दर वेगळे आहेत.|सेंट्रल बँक ऑफ इंडिया.|फक्त सेंट्रल बँक."],
i_green:["Central Bank has cheaper schemes for green (eco-friendly) homes.|Central Bank of India (0.10% lower for Home Loan and 3rd/4th/5th house; same for Grih Lakshmi).|Central Bank only.","सेंट्रल बैंक की ग्रीन (पर्यावरण-अनुकूल) घरों के लिए सस्ती योजनाएँ हैं।|सेंट्रल बैंक ऑफ इंडिया (होम लोन और तीसरे/चौथे/पाँचवें घर पर 0.10% कम; गृह लक्ष्मी पर समान)।|केवल सेंट्रल बैंक।","सेंट्रल बँकेच्या ग्रीन (पर्यावरणपूरक) घरांसाठी स्वस्त योजना आहेत.|सेंट्रल बँक ऑफ इंडिया (गृहकर्ज आणि तिसऱ्या/चौथ्या/पाचव्या घरावर 0.10% कमी; गृह लक्ष्मीवर सारखेच).|फक्त सेंट्रल बँक."],
ownN:["Rate quoted from your advisor (optional)","आपके सलाहकार से मिली दर (वैकल्पिक)","तुमच्या सल्लागाराकडून मिळालेला दर (ऐच्छिक)"],
d2a:["EMI and savings figures are estimates too. Confirm with the bank or ","EMI और बचत के आँकड़े भी अनुमानित हैं। बैंक से पुष्टि करें या ","EMI आणि बचतीचे आकडेही अंदाजे आहेत. बँकेकडे खात्री करा किंवा "],
d2b:["book a free introductory call with our advisor.","हमारे सलाहकार के साथ मुफ़्त परिचयात्मक कॉल बुक करें।","आमच्या सल्लागारासोबत मोफत ओळख कॉल बुक करा."],
empty:["Your estimated rates will appear here.","आपकी अनुमानित दरें यहाँ दिखेंगी।","तुमचे अंदाजे दर येथे दिसतील."],

 var sg="";
